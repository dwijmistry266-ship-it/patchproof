name: Bug report
description: Report a reproducible problem in PatchProof
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Do not include secrets, private repository contents, or sensitive logs.
  - type: input
    id: version
    attributes:
      label: PatchProof version
      description: Include the release tag or commit SHA.
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: Python 3.11.9
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe command, input fixture, or repository shape that demonstrates the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Redact tokens, credentials, private paths, and proprietary source before posting.
      render: text
    validations:
      required: false
